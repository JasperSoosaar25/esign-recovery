name: Original ASN1 recovery
on:
  push:
    branches: [recover-asn1-input-20261020]
    paths:
      - scripts/research_asn1_input.py
      - scripts/recover_asn1_input.py
      - scripts/build_asn1_input.py
      - tests/asn1_input_runtime.py
      - reconstruction/asn1-input/**
      - .github/workflows/asn1-recovery.yml
permissions:
  contents: read
jobs:
  inspect-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned packages and restore original evidence
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-reconstruction.txt
          .venv/bin/python scripts/unpack_evidence.py
      - name: Inspect the original ASN1 decoder dependencies
        run: .venv/bin/python scripts/research_asn1_input.py
      - name: Retain selected public algorithm evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-asn1-input-study
          path: build/asn1-study.json
          if-no-files-found: error
