name: Import verified native recovery update
on:
  push:
    paths:
      - recovery-update.json
      - recovery-update-*.part
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify unchanged preimages and import reviewed update
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, pathlib, re, tarfile
          raw = pathlib.Path('recovery-update.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '870b5a0a79b944a1a6f7c8f83e22a83d0ecba198c96b3a2a2e49daaef7053158'
          manifest = json.loads(raw)
          pieces = []
          for part in manifest['parts']:
              assert re.fullmatch(r'recovery-update-[0-9]{2}\.part', part['path'])
              data = pathlib.Path(part['path']).read_bytes()
              assert len(data) == part['size'] and hashlib.sha256(data).hexdigest() == part['sha256']
              pieces.append(data)
          archive = b''.join(pieces)
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256']
          expanded = gzip.decompress(archive)
          assert len(expanded) == manifest['uncompressed_bytes'] < 100_000_000
          expected = {}
          for item in manifest['updates']:
              path = pathlib.PurePosixPath(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not item['path'].startswith('.github/workflows/')
              local = pathlib.Path(item['path'])
              assert not local.is_symlink()
              if item['previous_sha256'] is None:
                  assert not local.exists(), item['path']
              else:
                  assert local.is_file() and hashlib.sha256(local.read_bytes()).hexdigest() == item['previous_sha256'], item['path']
              expected[item['path']] = item['sha256']
          with tarfile.open(fileobj=io.BytesIO(expanded)) as tar:
              members = tar.getmembers()
              assert len(members) == len(expected) and {m.name for m in members} == expected.keys()
              assert all(m.isfile() for m in members)
              tar.extractall('.', filter='data')
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
          for part in manifest['parts']:
              pathlib.Path(part['path']).unlink()
          pathlib.Path('recovery-update.json').unlink()
          print('Imported', len(expected), 'verified native recovery update files.')
          PY
      - name: Install pinned reconstruction verification tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-reconstruction.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate complete recovery and compiled source fragments
        run: |
          python3 scripts/unpack_evidence.py
          python3 scripts/unpack_native_methods.py
          python3 scripts/verify_repository.py
          python3 scripts/verify_original_flow.py
          python3 scripts/verify_app_analysis.py
          python3 scripts/verify_native_methods.py
          python3 scripts/recover_scalar_accessors.py --verify
          python3 -m unittest discover -s tests -v
      - name: Commit verified native recovery improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify exact IPA and publish fuller native recovery and tested C fragments"
          git push origin HEAD:main
