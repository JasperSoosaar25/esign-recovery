name: Verify recovery evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned analysis dependency for control-flow tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-reconstruction.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore the hash-verified complete recovery snapshot
        run: python3 scripts/unpack_evidence.py
      - name: Restore individually indexed fuller native method outputs
        run: python3 scripts/unpack_native_methods.py
      - name: Verify recovery provenance and all byte listings
        run: python3 scripts/verify_repository.py
      - name: Compare separate flow studies with original instruction bytes
        run: python3 scripts/verify_original_flow.py
      - name: Verify complete app-method traces and fuller decompiler exports
        run: |
          python3 scripts/verify_app_analysis.py
          python3 scripts/verify_native_methods.py
      - name: Compile scalar source and compare with original ARM64 instructions
        run: python3 scripts/recover_scalar_accessors.py --verify
      - name: Execute original localization instructions with explicit Foundation models
        run: python3 scripts/recover_localization.py --verify
      - name: Execute original signature-container methods and verify source fixtures
        run: python3 scripts/recover_signature_blobs.py --verify
      - name: Test audit rejection of corrupted evidence
        run: python3 -m unittest discover -s tests -v
  native-localization:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile Objective-C for iOS and test the component with Apple Foundation
        run: python3 scripts/build_localization.py
      - name: Preserve the component library and exact toolchain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-derived-localization-library
          path: |
            build/localization/libESignLocalization.a
            build/localization/build-report.json
          if-no-files-found: error
  native-signature-blobs:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile original-derived signing containers and check native ABI and Foundation behavior
        run: python3 scripts/build_signature_blobs.py
      - name: Preserve the component library and exact toolchain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-derived-signature-blobs-library
          path: |
            build/signature-blobs/libESignSignatureBlobs.a
            build/signature-blobs/build-report.json
          if-no-files-found: error
