name: Verify recovery evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned analysis dependency for control-flow tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-reconstruction.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Restore the hash-verified complete recovery snapshot
        run: python3 scripts/unpack_evidence.py
      - name: Restore individually indexed fuller native method outputs
        run: python3 scripts/unpack_native_methods.py
      - name: Verify recovery provenance and all byte listings
        run: python3 scripts/verify_repository.py
      - name: Compare separate flow studies with original instruction bytes
        run: python3 scripts/verify_original_flow.py
      - name: Verify complete app-method traces and fuller decompiler exports
        run: |
          python3 scripts/verify_app_analysis.py
          python3 scripts/verify_native_methods.py
      - name: Compile scalar source and compare with original ARM64 instructions
        run: python3 scripts/recover_scalar_accessors.py --verify
      - name: Execute original localization instructions with explicit Foundation models
        run: python3 scripts/recover_localization.py --verify
      - name: Execute original signature-container methods and verify source fixtures
        run: python3 scripts/recover_signature_blobs.py --verify
      - name: Execute original Mach-O header methods with explicit ivar realization
        run: python3 scripts/recover_mach_header.py --verify
      - name: Execute expanded original entitlement methods and dictionary callback
        run: python3 scripts/recover_entitlements.py --verify
      - name: Execute original load-command hierarchy and string-copy behavior
        run: python3 scripts/recover_load_commands.py --verify
      - name: Execute original recursive DER helpers and preserve the unresolved zero probe
        run: python3 scripts/recover_recursive_der.py --verify
      - name: Execute original requirement-slot method and native byte-writing blocks
        run: python3 scripts/recover_requirements_slot.py --verify
      - name: Execute original CodeDirectory construction and digest dependencies
        run: python3 scripts/recover_code_directory.py --verify
      - name: Execute original legacy crypto helpers with explicit unresolved-callee boundaries
        run: python3 scripts/recover_legacy_crypto.py --verify
      - name: Execute original alternate-CMS wrapper and retain bounded fault observations
        run: python3 scripts/recover_rsa_wrapper.py --verify
      - name: Execute original provisioning-profile methods with explicit CMS and certificate boundaries
        run: python3 scripts/recover_mobileprovision.py --verify
      - name: Execute original CMS content accessor and its bounded byte dispatch
        run: python3 scripts/recover_cms_content.py --verify
      - name: Execute original OID lookups, static data and hash-table retrieval
        run: python3 scripts/recover_oid_lookup.py --verify
      - name: Execute original BIO and memory-buffer methods against saved native fixtures
        run: python3 scripts/recover_bio_input.py --verify
      - name: Execute original ASN1 input and compare native stream/header effects
        run: python3 scripts/recover_asn1_input.py --verify
      - name: Execute original ASN1 item, template, cache and selector logic
        run: python3 scripts/recover_asn1_item.py --verify
      - name: Execute original ASN1 value converters, collection and non-explicit templates
        run: python3 scripts/recover_asn1_value.py --verify
      - name: Execute original ASN1 object constructors, destructors and strings
        run: python3 scripts/recover_asn1_object.py --verify
      - name: Execute original stacks and ASN1 content conversion
        run: python3 scripts/recover_asn1_primitives.py --verify
      - name: Execute original CMS schema, callbacks and full memory BIO compositions
        run: python3 scripts/recover_cms_schema.py --verify
      - name: Execute original X509 names, certificate/CRL callbacks and actual parser compositions
        run: python3 scripts/recover_x509_state.py --verify
      - name: Verify the source-only component Xcode project manifest and generated files
        run: python3 scripts/generate_component_project.py --verify
      - name: Test audit rejection of corrupted evidence
        run: python3 -m unittest discover -s tests -v
  native-localization:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile Objective-C for iOS and test the component with Apple Foundation
        run: python3 scripts/build_localization.py
      - name: Preserve the component library and exact toolchain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-derived-localization-library
          path: |
            build/localization/libESignLocalization.a
            build/localization/build-report.json
          if-no-files-found: error
