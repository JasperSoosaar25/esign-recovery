name: Import verified recovery snapshot
on:
  push:
    paths:
      - recovery-import.json
      - recovery-import-*.part
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check and restore the audited snapshot
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, pathlib, re, tarfile
          root = pathlib.Path.cwd()
          raw = pathlib.Path('recovery-import.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'c5ca62eef8dc53fb19484bc13dcec10aa45335189203d375155b23077eb4b715'
          manifest = json.loads(raw)
          pieces = []
          for part in manifest['parts']:
              assert re.fullmatch(r'recovery-import-[0-9]{2}\.part', part['path'])
              data = pathlib.Path(part['path']).read_bytes()
              assert len(data) == part['size'] and hashlib.sha256(data).hexdigest() == part['sha256']
              pieces.append(data)
          archive = b''.join(pieces)
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256']
          data = gzip.decompress(archive)
          assert len(data) == manifest['uncompressed_size'] < 100_000_000
          with tarfile.open(fileobj=io.BytesIO(data)) as tar:
              for member in tar.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert member.isfile() or member.isdir()
                  assert not member.name.startswith('.github/workflows/')
              tar.extractall(root, filter='data')
          for name, digest in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          for part in manifest['parts']:
              pathlib.Path(part['path']).unlink()
          pathlib.Path('recovery-import.json').unlink()
          pathlib.Path('docs/PUBLICATION.json').write_text(json.dumps({
              'local_recovery_commit': manifest['source_commit'],
              'verified_import_archive_sha256': manifest['archive_sha256'],
              'imported_file_count': len(manifest['files']),
              'full_native_source_build_verified': False,
              'pixeldrain_input_identity_verified': False
          }, indent=2) + '\n')
          print('Verified', len(manifest['files']), 'source snapshot files before import.')
          PY
      - name: Install analysis dependency
        run: python3 -m pip install -r requirements-recovery.txt
      - name: Verify complete restored recovery and tools
        run: |
          python3 scripts/unpack_evidence.py
          python3 scripts/verify_repository.py
          python3 scripts/verify_original_flow.py
          python3 scripts/verify_app_analysis.py
          python3 -m unittest discover -s tests -v
      - name: Commit the verified recovery tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import verified ESign recovery evidence and contributor tools"
          git push origin HEAD:main
